name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: WebView debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build generic WebView debug APK
        run: ./gradlew --no-daemon assembleGenericGeckoExcludedDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tvbrowser-debug-webview
          path: app/build/outputs/apk/genericGeckoExcluded/debug/*.apk
          if-no-files-found: error
          retention-days: 14
